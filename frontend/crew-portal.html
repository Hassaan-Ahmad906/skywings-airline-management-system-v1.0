<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airport Crew Portal | SkyWings</title><link rel="icon" href="images/transparent_logo_clean.PNG"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/operations.css"></head>
<body class="admin-body"><main class="container"><nav class="crew-topnav" aria-label="Crew navigation"><a class="brand-link" href="crew-portal.html"><img src="images/transparent_logo.PNG" class="nav-logo" alt=""><strong>SkyWings · Airport crew</strong></a><div class="ops-actions"><a href="admin-dashboard.html" id="crewAdminLink" hidden>Admin dashboard</a><button type="button" class="btn btn-secondary" onclick="handleLogout()">Sign out</button></div></nav>
<section class="ops-panel"><div class="ops-heading"><div><p class="ops-eyebrow">Departure control</p><h1>Gate operations</h1><p id="crewScope">Select a flight to manage its gate and passenger manifest.</p></div><button type="button" class="btn btn-secondary" onclick="loadGateFlights()">Refresh flights</button></div><div id="gateOperations"></div></section>
<section id="crewAccountPanel" class="ops-panel" hidden><h2>Create airport crew account</h2><p>Staff receive gate access for their assigned departure airport. Only administrators can create these accounts.</p><form id="crewAccountForm" class="ops-toolbar" onsubmit="createGateStaff(event)"><label>First name<input name="first_name" maxlength="100" required></label><label>Last name<input name="last_name" maxlength="100" required></label><label>Email<input name="email" type="email" required></label><label>Airport<select name="airport" id="crewAccountAirport" required></select></label><label>Initial password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label><button type="submit" class="btn btn-primary">Create staff account</button></form><p id="crewAccountResult" role="status"></p></section>
</main><script src="js/html.js"></script><script src="js/payments.js"></script><script src="js/seat-map.js"></script><script src="js/accessibility.js"></script><script src="js/main.js"></script><script src="js/gate-portal.js"></script></body></html>
