<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SkyWings Airlines</title>
    <link rel="icon" type="image/png" href="images/transparent_logo_clean.PNG">
    <link rel="shortcut icon" type="image/png" href="images/transparent_logo_clean.PNG">
    <link rel="apple-touch-icon" href="images/transparent_logo_clean.PNG">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page dark-mode">
    <div class="auth-layout">
        <section class="auth-panel auth-panel--brand">
            <a href="index.html" class="brand-link" aria-label="SkyWings Airlines homepage">
                <img src="images/transparent_logo.PNG" alt="SkyWings" class="auth-brand-logo">
                <div class="brand-lockup">
                    <p class="eyebrow">SkyWings Airlines</p>
                    <h1>Create your account</h1>
                </div>
            </a>
            <p class="panel-copy">Join SkyWings and manage all your flights from one polished, secure experience.</p>
        </section>

        <section class="auth-panel auth-panel--form">
            <div class="auth-card">
                <div class="auth-header">
                    <p class="eyebrow">New traveler</p>
                    <h2>Sign up</h2>
                </div>

                <form class="auth-form auth-form--compact" onsubmit="handleRegister(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First name</label>
                            <input id="firstName" type="text" name="firstName" placeholder="First name" required autocomplete="given-name">
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last name</label>
                            <input id="lastName" type="text" name="lastName" placeholder="Last name" required autocomplete="family-name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">Email address</label>
                        <input id="regEmail" type="email" name="email" placeholder="you@example.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input id="regPassword" type="password" name="password" placeholder="Create a password" required minlength="6" autocomplete="new-password">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>
                        <input id="confirmPassword" type="password" name="confirmPassword" placeholder="Confirm password" required autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Sign in</a></p>
                </div>
            </div>
        </section>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
